<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PTG Bug Reports Admin</title>
  <meta http-equiv="refresh" content="0; url=https://phrasetoguess.xyz/admin.html" />
  <script>
    (function () {
      // Prefer same-origin admin.html when main site is deployed; keep ?key= migration.
      try {
        var dest = new URL("/admin.html", location.origin);
        var src = new URL(location.href);
        var key = (src.searchParams.get("key") || "").trim();
        if (key) dest.searchParams.set("key", key);
        // If this file is somehow served outside production, fall back to known standalone.
        if (!/phrasetoguess\.xyz$/i.test(location.hostname) && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
          location.replace("https://ptg-bug-admin-standalone.vercel.app/");
          return;
        }
        location.replace(dest.pathname + dest.search + dest.hash);
      } catch (_) {
        location.replace("/admin.html");
      }
    })();
  </script>
</head>
<body>
  <p style="font-family: system-ui, sans-serif; padding: 24px; background:#070b14; color:#edf2ff; min-height:100vh; margin:0;">
    Open the admin panel:
    <a href="/admin.html" style="color:#8eb6ff;">/admin.html</a>
    or
    <a href="https://ptg-bug-admin-standalone.vercel.app/" style="color:#8eb6ff;">standalone</a>
  </p>
</body>
</html>
